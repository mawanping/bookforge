name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint & test (${{ matrix.os }} · py${{ matrix.py }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        py: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          # Linux CI 需要装一个中文字体来验证 fonts.py 走 Noto 路径；
          # macOS 自带 PingFang；Windows 自带 msyh.ttc，CI 上不一定有中文字体。
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          fi

      - name: Lint (syntax + import smoke)
        run: |
          python -m compileall -q bookforge
          python -c "import bookforge.cli, bookforge.publish, bookforge.detect, bookforge.site_config, bookforge.fonts"

      - name: Tests
        run: |
          pytest -q --color=yes

      - name: Doctor (smoke check on the CLI)
        run: |
          bookforge doctor || true

      - name: Version
        run: python -m bookforge --version